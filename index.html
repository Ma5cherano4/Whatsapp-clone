<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persistent Chat with History</title>
  <style>
    :root {
      --bg: #12121a;
      --card: #1e1e2d;
      --accent: #ff3366;
      --text: #ffffff;
      --subtext: #a0a0b0;
      --bubble: #252538;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .chat-container { width: 100%; max-width: 480px; height: 90vh; max-height: 700px; background: var(--card); border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden; }

    .chat-header { padding: 16px; background: #161622; border-bottom: 1px solid #2a2a3d; text-align: center; }
    .chat-header h1 { font-size: 18px; color: var(--accent); }

    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

    .message-card { background: var(--bubble); padding: 12px; border-radius: 12px; max-width: 85%; font-size: 14px; position: relative; word-break: break-word; }
    .message-card .username { font-weight: bold; color: #ff80ab; margin-bottom: 4px; font-size: 13px; }
    .message-card .timestamp { font-size: 10px; color: var(--subtext); float: right; margin-top: 4px; margin-left: 8px; }
    
    .quoted-box { background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 6px; border-left: 2px solid var(--accent); color: var(--subtext); }

    .reply-btn { background: none; border: none; color: var(--subtext); font-size: 11px; cursor: pointer; margin-top: 6px; display: inline-block; text-decoration: underline; }
    .reply-btn:hover { color: var(--text); }

    #reply-preview { display: none; background: #161622; padding: 10px 16px; border-top: 1px solid #2a2a3d; font-size: 13px; justify-content: space-between; align-items: center; }
    #reply-preview .preview-content { color: var(--subtext); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 85%; }
    #reply-preview button { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; font-size: 14px; }

    .chat-input-area { padding: 16px; background: #161622; border-top: 1px solid #2a2a3d; display: flex; flex-direction: column; gap: 8px; }
    
    .input-row { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; background: #121217; border: 1px solid #333; border-radius: 10px; padding: 12px; color: var(--text); font-size: 14px; outline: none; }
    input[type="text"]:focus { border-color: var(--accent); }

    .send-btn { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
    .send-btn:hover { opacity: 0.9; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 10; }
    .modal-card { background: var(--card); padding: 24px; border-radius: 16px; width: 90%; max-width: 320px; text-align: center; }
    .modal-card h2 { margin-bottom: 12px; font-size: 18px; }
  </style>
</head>
<body>

  <div id="name-modal" class="modal-overlay">
    <div class="modal-card">
      <h2>Enter Chat</h2>
      <input type="text" id="modal-name" placeholder="Your username..." style="width: 100%; margin-bottom: 12px;" />
      <button class="send-btn" style="width: 100%; padding: 12px;" onclick="joinChat()">Start Chatting</button>
    </div>
  </div>

  <div class="chat-container">
    <div class="chat-header">
      <h1>💬 Femi's chat room</h1>
    </div>

    <div class="chat-messages" id="messages-container"></div>

    <div id="reply-preview">
      <div class="preview-content" id="reply-preview-text">Replying to...</div>
      <button onclick="cancelReply()">✕</button>
    </div>

    <form class="chat-input-area" onsubmit="sendMessage(event)">
      <div class="input-row">
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" required />
        <button type="submit" class="send-btn">Send</button>
      </div>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myName = '';
    let currentReplyTo = null;

    function joinChat() {
      const input = document.getElementById('modal-name');
      const name = input.value.trim();
      if (name) {
        myName = name;
        document.getElementById('name-modal').style.display = 'none';
      }
    }

    const messagesContainer = document.getElementById('messages-container');

    socket.on('load messages', (messages) => {
      messagesContainer.innerHTML = '';
      messages.forEach(appendMessage);
    });

    socket.on('new message', (msg) => {
      appendMessage(msg);
    });

    function appendMessage(m) {
      let quoteHtml = '';
      if (m.replyTo) {
        quoteHtml = `
          <div class="quoted-box">
            ↳ <strong>${escapeHtml(m.replyTo.user)}</strong>: ${escapeHtml(m.replyTo.text)}
          </div>
        `;
      }

      const msgDiv = document.createElement('div');
      msgDiv.className = 'message-card';
      msgDiv.innerHTML = `
        ${quoteHtml}
        <div class="username">${escapeHtml(m.user)}</div>
        <div>${escapeHtml(m.text)}</div>
        <div>
          <button class="reply-btn" onclick="setReply('${m.id}', '${escapeHtml(m.user).replace(/'/g, "\\'")}', '${escapeHtml(m.text).replace(/'/g, "\\'")}')">Reply</button>
          <span class="timestamp">${m.time}</span>
        </div>
      `;
      messagesContainer.appendChild(msgDiv);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setReply(id, user, text) {
      currentReplyTo = { id, user, text };
      const preview = document.getElementById('reply-preview');
      const previewText = document.getElementById('reply-preview-text');
      preview.style.display = 'flex';
      previewText.innerHTML = `Replying to <strong>${user}</strong>: "${text}"`;
      document.getElementById('msg-input').focus();
    }

    function cancelReply() {
      currentReplyTo = null;
      document.getElementById('reply-preview').style.display = 'none';
    }

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();

      if (text && myName) {
        socket.emit('send message', {
          user: myName,
          text: text,
          replyTo: currentReplyTo
        });
        input.value = '';
        cancelReply();
      }
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }
  </script>
</body>
</html>

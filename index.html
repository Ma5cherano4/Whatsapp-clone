<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Femi's chat app</title>
  <!-- Link the PWA Manifest -->
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0f0f13;
      --card: #181822;
      --accent: #ff3366;
      --text: #ffffff;
      --subtext: #9090a0;
      --bubble: #222232;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }

    .app-container { width: 100%; max-width: 480px; height: 95vh; background: var(--card); border-radius: 20px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

    .header { padding: 14px; background: #121219; border-bottom: 1px solid #2a2a3d; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 15px; color: var(--accent); }
    .header-btns { display: flex; gap: 6px; }
    .call-btn { background: #00e676; border: none; padding: 6px 10px; border-radius: 8px; color: black; font-weight: bold; cursor: pointer; font-size: 11px; }
    .install-btn { background: var(--accent); border: none; padding: 6px 10px; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 11px; display: none; }

    .chat-box { flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

    .msg { background: var(--bubble); padding: 10px 14px; border-radius: 12px; max-width: 85%; font-size: 14px; word-break: break-word; position: relative; }
    .msg .user { font-weight: bold; color: #ff80ab; font-size: 12px; margin-bottom: 3px; }
    .msg img { width: 100%; border-radius: 8px; margin-top: 4px; cursor: pointer; }
    .msg audio { width: 100%; margin-top: 4px; height: 35px; }
    .timestamp { font-size: 9px; color: var(--subtext); float: right; margin-top: 4px; margin-left: 6px; }

    .view-once-card { background: rgba(255, 51, 102, 0.15); border: 1px solid var(--accent); padding: 10px; border-radius: 8px; text-align: center; cursor: pointer; }
    .view-once-card button { background: var(--accent); color: white; border: none; padding: 6px 12px; border-radius: 6px; margin-top: 6px; cursor: pointer; font-weight: bold; }

    .quoted { background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px; font-size: 11px; margin-bottom: 4px; border-left: 2px solid var(--accent); color: var(--subtext); }

    #reply-preview { display: none; background: #121219; padding: 8px 14px; font-size: 12px; border-top: 1px solid #2a2a3d; justify-content: space-between; align-items: center; color: var(--subtext); }
    #reply-preview button { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; }

    .input-area { padding: 12px; background: #121219; border-top: 1px solid #2a2a3d; display: flex; flex-direction: column; gap: 8px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    input[type="text"] { flex: 1; background: #0a0a0f; border: 1px solid #333; border-radius: 10px; padding: 10px; color: var(--text); font-size: 14px; outline: none; }
    
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px; color: var(--subtext); }
    .icon-btn:hover { color: var(--accent); }
    .send-btn { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 0 14px; height: 38px; font-weight: bold; cursor: pointer; }

    #call-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
    video { width: 80%; max-width: 360px; border-radius: 12px; background: #000; }
    .hangup-btn { background: #ff5252; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 50; }
    .modal-content { background: var(--card); padding: 20px; border-radius: 14px; width: 85%; max-width: 300px; text-align: center; }
  </style>
</head>
<body>

  <div id="name-modal" class="modal">
    <div class="modal-content">
      <h2 style="margin-bottom: 10px; font-size: 18px;">Enter Chat Name</h2>
      <input type="text" id="username-input" placeholder="Your nickname..." style="width:100%; margin-bottom: 12px; padding:10px; background:#0a0a0f; border:1px solid #333; color:#fff; border-radius:8px;" />
      <button class="send-btn" style="width:100%;" onclick="startApp()">Join Room</button>
    </div>
  </div>

  <div id="call-overlay">
    <h2 id="call-status">Live Call</h2>
    <video id="remote-video" autoplay playsinline></video>
    <video id="local-video" autoplay playsinline muted style="width: 120px; position: absolute; bottom: 80px; right: 20px; border: 2px solid white;"></video>
    <button class="hangup-btn" onclick="endCall()">End Call</button>
  </div>

  <div class="app-container">
    <div class="header">
      <h1>💬 Femi's Chat App</h1>
      <div class="header-btns">
        <button id="install-btn" class="install-btn" onclick="installApp()">📥 Install</button>
        <button class="call-btn" onclick="startCall()">📞 Call</button>
      </div>
    </div>

    <div class="chat-box" id="chat-messages"></div>

    <div id="reply-preview">
      <span id="reply-text">Replying...</span>
      <button onclick="cancelReply()">✕</button>
    </div>

    <div class="input-area">
      <div style="display:flex; align-items:center; gap: 8px; font-size: 12px; color: var(--subtext);">
        <label><input type="checkbox" id="view-once-check"> View Once 👁️</label>
      </div>
      <div class="input-row">
        <label class="icon-btn" title="Send Picture">📷<input type="file" id="img-file" accept="image/*" style="display:none" onchange="sendImage(this)"></label>
        <button class="icon-btn" id="mic-btn" title="Hold to record VN" onmousedown="startRecording()" onmouseup="stopRecording()">🎤</button>
        <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off" />
        <button class="send-btn" onclick="sendTextMessage()">Send</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myName = '';
    let currentReply = null;
    let mediaRecorder;
    let audioChunks = [];

    // PWA Install Prompt Logic
    let deferredPrompt;
    const installBtn = document.getElementById('install-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.style.display = 'block'; // Show install button when available
    });

    function installApp() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
          if (choiceResult.outcome === 'accepted') {
            installBtn.style.display = 'none';
          }
          deferredPrompt = null;
        });
      }
    }

    function startApp() {
      const val = document.getElementById('username-input').value.trim();
      if (val) {
        myName = val;
        document.getElementById('name-modal').style.display = 'none';
      }
    }

    const chatBox = document.getElementById('chat-messages');

    socket.on('load messages', (msgs) => {
      chatBox.innerHTML = '';
      msgs.forEach(renderMsg);
    });

    socket.on('new message', (msg) => {
      renderMsg(msg);
    });

    socket.on('view-once opened', (id) => {
      const el = document.getElementById(`msg-${id}`);
      if (el) el.innerHTML = `<i style="color:var(--subtext)">[View-once media opened & expired]</i>`;
    });

    function renderMsg(m) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.id = `msg-${m.id}`;

      let quoteHtml = m.replyTo ? `<div class="quoted">↳ <strong>${m.replyTo.user}</strong>: ${m.replyTo.content}</div>` : '';
      
      let contentHtml = '';
      if (m.viewOnce && !m.viewed && m.user !== myName) {
        contentHtml = `
          <div class="view-once-card" onclick="openViewOnce('${m.id}', '${m.type}', '${m.content}')">
            🔒 View-Once ${m.type === 'image' ? 'Picture' : 'Message'}
            <br><button>Tap to Open</button>
          </div>
        `;
      } else if (m.type === 'image') {
        contentHtml = `<img src="${m.content}" />`;
      } else if (m.type === 'vn') {
        contentHtml = `<audio controls src="${m.content}"></audio>`;
      } else {
        contentHtml = `<div>${m.content}</div>`;
      }

      div.innerHTML = `
        ${quoteHtml}
        <div class="user">${m.user}</div>
        ${contentHtml}
        <div>
          <button onclick="setReply('${m.id}', '${m.user}', '${m.content.substring(0,20)}')" style="background:none; border:none; color:var(--subtext); font-size:10px; cursor:pointer; text-decoration:underline;">Reply</button>
          <span class="timestamp">${m.time}</span>
        </div>
      `;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendTextMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      const viewOnce = document.getElementById('view-once-check').checked;

      if (!text || !myName) return;

      socket.emit('send message', {
        user: myName,
        type: 'text',
        content: text,
        viewOnce: viewOnce,
        replyTo: currentReply
      });

      input.value = '';
      document.getElementById('view-once-check').checked = false;
      cancelReply();
    }

    function sendImage(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('send message', {
          user: myName,
          type: 'image',
          content: e.target.result,
          viewOnce: document.getElementById('view-once-check').checked,
          replyTo: currentReply
        });
        input.value = '';
        cancelReply();
      };
      reader.readAsDataURL(file);
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          const reader = new FileReader();
          reader.onload = e => {
            socket.emit('send message', {
              user: myName,
              type: 'vn',
              content: e.target.result,
              viewOnce: document.getElementById('view-once-check').checked,
              replyTo: currentReply
            });
            cancelReply();
          };
          reader.readAsDataURL(blob);
        };
        mediaRecorder.start();
        document.getElementById('mic-btn').style.color = '#ff3366';
      } catch (err) {
        alert('Microphone access denied.');
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        document.getElementById('mic-btn').style.color = 'var(--subtext)';
      }
    }

    function openViewOnce(id, type, content) {
      socket.emit('consume view-once', id);
      const modal = document.createElement('div');
      modal.className = 'modal';
      modal.innerHTML = `
        <div class="modal-content" style="max-width:340px;">
          <h3 style="margin-bottom:10px; color:var(--accent);">View-Once Media</h3>
          ${type === 'image' ? `<img src="${content}" style="width:100%; border-radius:8px;" />` : `<div>${content}</div>`}
          <button class="send-btn" style="width:100%; margin-top:12px;" onclick="this.parentElement.parentElement.remove()">Close</button>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function setReply(id, user, text) {
      currentReply = { id, user, content: text };
      document.getElementById('reply-preview').style.display = 'flex';
      document.getElementById('reply-text').innerHTML = `Replying to <strong>${user}</strong>: "${text}"`;
    }

    function cancelReply() {
      currentReply = null;
      document.getElementById('reply-preview').style.display = 'none';
    }

    let peerConnection;
    let localStream;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    async function startCall() {
      document.getElementById('call-overlay').style.display = 'flex';
      localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
      document.getElementById('local-video').srcObject = localStream;

      peerConnection = new RTCPeerConnection(servers);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.ontrack = e => {
        document.getElementById('remote-video').srcObject = e.streams[0];
      };

      peerConnection.onicecandidate = e => {
        if (e.candidate) socket.emit('ice-candidate', e.candidate);
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call-user', { from: myName, offer: offer });
    }

    socket.on('incoming-call', async (data) => {
      if (confirm(`Incoming call from ${data.from}. Accept?`)) {
        document.getElementById('call-overlay').style.display = 'flex';
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        peerConnection = new RTCPeerConnection(servers);
        localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.ontrack = e => {
          document.getElementById('remote-video').srcObject = e.streams[0];
        };

        peerConnection.onicecandidate = e => {
          if (e.candidate) socket.emit('ice-candidate', e.candidate);
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('make-answer', { answer: answer });
      }
    });

    socket.on('call-answered', async (data) => {
      await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
    });

    socket.on('ice-candidate', async (candidate) => {
      if (peerConnection) {
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      }
    });

    function endCall() {
      if (localStream) localStream.getTracks().forEach(t => t.stop());
      if (peerConnection) peerConnection.close();
      document.getElementById('call-overlay').style.display = 'none';
      location.reload();
    }
  </script>
</body>
</html>
